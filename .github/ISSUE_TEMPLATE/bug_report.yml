name: Bug report
description: Something isn't working as documented.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        Before submitting, please check the existing issues to avoid duplicates.
        For security issues, please follow [SECURITY.md](../SECURITY.md) instead.

  - type: input
    id: tool-version
    attributes:
      label: Tool version
      description: Output of `sourcegraph-mcp --version` or the `<Version>` from your `.csproj`.
      placeholder: "0.7.0"
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`.
      placeholder: "10.0.203"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other (please specify in description)
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      description: e.g. Claude Code 1.x, Cursor, Continue, Claude Desktop, custom.
      placeholder: "Claude Code 1.0.43"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        If possible, share a minimal solution / repo or a unit test. Otherwise, list the
        commands and tool calls that trigger the bug.
      placeholder: |
        1. `sourcegraph-mcp serve --solution ./My.slnx`
        2. Call MCP tool `find_references` with `{ "symbol": "Foo.Bar" }`
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / `usage.jsonl` excerpt
      description: |
        Paste anything relevant from stderr or `<root>/.sourcegraph/usage.jsonl`.
        Please redact any source paths or symbol names you'd rather not share.
      render: shell

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: This is not a security issue (those go through SECURITY.md).
          required: true
