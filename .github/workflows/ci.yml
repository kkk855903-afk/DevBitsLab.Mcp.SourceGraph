name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so per-symbol git-blame tests have something to read

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore DevBitsLab.Mcp.SourceGraph.slnx --locked-mode

      - name: Audit top-level and transitive packages
        shell: pwsh
        run: ./.github/scripts/assert-no-vulnerable-packages.ps1

      - name: Build
        run: dotnet build -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test (with coverage)
        run: >
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --
          RunConfiguration.CollectSourceInformation=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml

  pack:
    name: pack (smoke)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DevBitsLab.Mcp.SourceGraph.slnx --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Pack tool
        run: dotnet pack src/DevBitsLab.Mcp.SourceGraph.Server -c Release --no-build -o ./out

      - name: Pack SDK
        run: dotnet pack src/DevBitsLab.Mcp.SourceGraph.Sdk -c Release --no-build -o ./out

      - name: Verify package identities and versions
        shell: pwsh
        run: |
          $toolProject = 'src/DevBitsLab.Mcp.SourceGraph.Server/DevBitsLab.Mcp.SourceGraph.Server.csproj'
          $sdkProject = 'src/DevBitsLab.Mcp.SourceGraph.Sdk/DevBitsLab.Mcp.SourceGraph.Sdk.csproj'
          $toolVersion = (& dotnet msbuild $toolProject -nologo -getProperty:Version | Out-String).Trim()
          $sdkVersion = (& dotnet msbuild $sdkProject -nologo -getProperty:Version | Out-String).Trim()
          $runtimeIdentifiers = (& dotnet msbuild $toolProject -nologo -getProperty:ToolPackageRuntimeIdentifiers | Out-String).Trim()
          ./.github/scripts/assert-release-packages.ps1 `
            -PackageDirectory ./out `
            -ToolVersion $toolVersion `
            -SdkVersion $sdkVersion `
            -ToolRuntimeIdentifiers $runtimeIdentifiers

      - name: Smoke installed tool package
        shell: pwsh
        run: >
          ./.github/scripts/smoke-installed-tool.ps1
          -PackageDirectory ./out
          -RunMcpIntegration

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./out/*.nupkg

  installed-runtime-smoke:
    name: installed runtime smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: ./out

      - name: Smoke installed runtime assets
        shell: pwsh
        run: >
          ./.github/scripts/smoke-installed-tool.ps1
          -PackageDirectory ./out
