name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so per-symbol git-blame tests have something to read

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test (with coverage)
        run: >
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --
          RunConfiguration.CollectSourceInformation=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml

  pack:
    name: pack (smoke)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Pack tool
        run: dotnet pack src/DevBitsLab.Mcp.SourceGraph.Server -c Release --no-build -o ./out

      - name: Pack SDK
        run: dotnet pack src/DevBitsLab.Mcp.SourceGraph.Sdk -c Release --no-build -o ./out

      - name: Smoke installed tool package
        shell: bash
        run: |
          smoke_config="$RUNNER_TEMP/sourcegraph-mcp-smoke-nuget.config"
          smoke_dir="$RUNNER_TEMP/sourcegraph-mcp-tool"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<configuration>' \
            '  <packageSources>' \
            '    <clear />' \
            "    <add key=\"local-pack-output\" value=\"$PWD/out\" />" \
            '  </packageSources>' \
            '</configuration>' \
            > "$smoke_config"

          dotnet tool install DevBitsLab.Mcp.SourceGraph.Tool \
            --tool-path "$smoke_dir" \
            --version 0.9.0 \
            --configfile "$smoke_config"

          tool_command="$smoke_dir/sourcegraph-mcp"
          test -x "$tool_command"
          "$tool_command" --help

          SOURCEGRAPH_MCP_INTEGRATION_COMMAND="$tool_command" \
            dotnet test tests/DevBitsLab.Mcp.SourceGraph.IntegrationTests \
              -c Release \
              --no-build \
              --no-restore \
              --filter "FullyQualifiedName=DevBitsLab.Mcp.SourceGraph.IntegrationTests.InitializeTests.Initialize_and_tools_list_against_Sample_complete_and_exit_cleanly"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./out/*.nupkg
