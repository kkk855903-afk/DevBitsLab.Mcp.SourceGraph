name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday scan keeps the result table fresh even when no PRs land.
    - cron: '23 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality
          # Exclude build artefacts from analysis. The C# source-generator output under
          # `obj/Release/.../*.g.cs` is auto-generated by `System.Text.Json.SourceGeneration`
          # and triggers `cs/useless-cast-to-self` warnings on hand-rolled patterns the
          # generator emits — code we don't write or maintain. Excluding `**/obj/**` and
          # `**/bin/**` removes the persistent false-positive noise on every PR.
          config: |
            paths-ignore:
              - "**/obj/**"
              - "**/bin/**"

      - name: Build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
